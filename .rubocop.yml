AllCops:
  TargetRubyVersion: 3.0
  NewCops: disable
  SuggestExtensions: false

# Size metrics are tuned for applications. This repository keeps rubocop
# focused on style, layout and correctness instead of method size.
Metrics/AbcSize:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/MethodLength:
  Enabled: false

Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Lint/StructNewOverride:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes
